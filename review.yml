aid: medrio
name: Medrio
review:
  question: Does Medrio expose a documented public WebSocket API?
  answer: false
  date: '2026-07-05'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Both of Medrio's documented public API
    surfaces - Medrio API Connect (connectapi.medrio.com) and the mSource API
    (esource.medrio.com) - are request/response REST over HTTPS secured with
    OAuth 2.0. There is no server-push transport (WebSocket or SSE) on Medrio's
    own APIs to model. API Connect does expose a "Subscriptions" resource, but
    it is a REST-configured event-subscription mechanism (create/list/update/
    delete subscriptions against a study's events-configuration) that would
    deliver notifications out-of-band to a downstream system, not a persistent
    WebSocket channel on Medrio's API.
findings:
  summary: |
    Medrio does not publish a documented public WebSocket API. Medrio is an
    eClinical / electronic data capture (EDC) platform for clinical trials.
    It exposes two documented REST APIs. Medrio API Connect
    (base https://connectapi.medrio.com) ships a live OpenAPI 3.0.1 description
    ("Medrio OpenApi v.42.13.0.201") and Swagger UI covering Studies, Subjects,
    Data Entry (eCRF), Memberships/Users, Sites, Roles, Groups, Subject
    Statuses, Subscriptions, and Configuration, with OAuth token issuance at
    /Oauth/token. The mSource API (base https://esource.medrio.com, V2, with V1
    available) backs the mPRO/mCapture eCOA/ePRO apps and covers Study, Subject,
    form, and approval data plus offline/audit/diagnostic logging, authenticated
    with OAuth 2.0 and a required X-Medrio-ClientInfo header. Both surfaces are
    pure request/response REST over HTTPS. No realtime, bidirectional, or
    streaming WebSocket (ws:// or wss://) endpoint is documented on either API.
  accessModel: |
    Medrio's API documentation is publicly reachable (the API Connect Swagger UI
    and raw swagger.json, and the mSource API Help pages are all viewable without
    login), but actual use is gated to Medrio customers: calls require an OAuth
    access token issued for a provisioned study/account. Medrio is commercial
    eClinical software; pricing is per-study / contact-sales and not published.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://connectapi.medrio.com
      documented: true
      note: Medrio API Connect. OpenAPI 3.0.1 + Swagger UI. OAuth token at /Oauth/token.
    - protocol: REST
      scheme: https
      baseURL: https://esource.medrio.com
      documented: true
      note: mSource API V2 (V1 also available). OAuth 2.0 at /api/oauth/token; requires X-Medrio-ClientInfo header.
    - protocol: Event Subscription
      scheme: https
      documented: true
      note: API Connect Subscriptions resource is REST-configured (CRUD) against a study's events-configuration; notification delivery is out-of-band, not a WebSocket channel on Medrio's API.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Medrio API Connect or the mSource API as of the review date.
