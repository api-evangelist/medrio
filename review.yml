actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Both of Medrio's documented public
    APIs (API Connect and mSource) are request/response REST over HTTPS with
    OAuth 2.0. The one event-oriented feature, API Connect Subscriptions, is
    REST-configured and delivers notifications out-of-band rather than over a
    persistent WebSocket channel, so there is no server-push transport on
    Medrio's own API to model with AsyncAPI.
