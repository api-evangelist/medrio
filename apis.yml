  humanURL: https://esource.medrio.com/Help
  baseURL: https://esource.medrio.com
  properties:
  - url: https://esource.medrio.com/Help
    type: APIReference
  - url: https://esource.medrio.com/Help?apiVersion=1
    type: Documentation
  description: The V2 REST API behind Medrio's mSource eCOA/ePRO applications (mPRO and
    mCapture) - read study configuration, files, and users; read and write subject,
    form, and approval data with an asynchronous key-based query pattern; and post
    offline access, audit trail, and diagnostic logs. Secured with OAuth 2.0 and a
    required X-Medrio-ClientInfo header.
