aid: medrio
url: https://raw.githubusercontent.com/api-evangelist/medrio/refs/heads/main/apis.yml
name: Medrio
kind: company
description: Medrio is an eClinical / electronic data capture (EDC) platform built for
  small and scaling life sciences teams, spanning EDC, ePRO/eCOA, eConsent, and RTSM
  for clinical trials across pharma, biotech, medtech, and diagnostics. Medrio exposes
  documented REST APIs for integration and data exchange. Medrio API Connect
  (connectapi.medrio.com) covers study configuration, subject enrollment and
  identifiers, eCRF form data entry, user and membership administration, reference
  data (sites, roles, groups, subject statuses), and event subscriptions; it ships a
  live OpenAPI 3.0 description and Swagger UI. The mSource API (esource.medrio.com)
  backs the mPRO and mCapture eCOA/ePRO applications for subject-, form-, and
  approval-level source data capture, including offline access. Both surfaces are
  request/response REST over HTTPS secured with OAuth 2.0; actual use is gated to
  Medrio customers with study credentials, and commercial pricing is per-study /
  contact-sales.
