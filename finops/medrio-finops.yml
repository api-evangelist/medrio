meters:
- name: study_subscription
  description: Per-study platform subscription; the primary Medrio cost unit, quoted by sales.
  unit: study
  aggregation: sum
  dimensions:
  - account
  - study
- name: licensed_modules
  description: Modules enabled per study (EDC, ePRO/eCOA, eConsent, RTSM) that shape the quote.
  unit: modules
  aggregation: sum
  dimensions:
  - study
- name: user_seats
  description: Total users provisioned across studies, a pricing parameter.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - study
principles:
- name: Visibility
  description: Track active studies, enabled modules, and user seats per program; API usage itself is bundled and not separately metered.
- name: Allocation
  description: Map each study subscription and its modules to the trial/program and cost center it belongs to.
- name: Optimization
  description: License only the modules and user seats a study needs; close out studies promptly; negotiate multi-study terms rather than optimizing per-call spend.
- name: Accountability
  description: Assign an owner per study; review renewals against active trial timelines and provisioned seats.
