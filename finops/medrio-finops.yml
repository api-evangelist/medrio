description: >-
  FinOps view of Medrio spend. Medrio is licensed commercial eClinical software,
  billed as a per-study subscription quoted by sales rather than as a metered,
  usage-priced API. The APIs (Medrio API Connect and the mSource API) are
  included with the underlying study/platform subscription and are not separately
  invoiced or metered per call. Cost drivers are the licensed modules
  (EDC, ePRO/eCOA, eConsent, RTSM), study size and duration, and total users -
  not API request volume.
notes: >-
  Per-study rates are not published; obtain a quote from Medrio. Because API
  usage is bundled into the study subscription, there is no per-call meter to
  optimize; cost governance is about scoping modules, studies, and user seats to
  what a program actually needs.
